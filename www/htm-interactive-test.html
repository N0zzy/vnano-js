<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTM Interactive Components Visual Test</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #333;
            display: flex;
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .sidebar {
            width: 300px;
            flex-shrink: 0;
        }

        .main {
            flex: 1;
        }

        .badge {
            background: #007bff;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            margin-left: 10px;
        }

        .badge.warn {
            background: #ffc107;
            color: #333;
        }

        .badge.danger {
            background: #dc3545;
        }

        .user-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: #007bff;
            color: white;
            font-weight: bold;
            margin-right: 5px;
            font-size: 14px;
        }

        .btn-danger {
            background: #dc3545;
        }

        .btn-success {
            background: #28a745;
        }

        .btn-sm {
            padding: 4px 8px;
            font-size: 12px;
        }

        /* Стили для модального окна */
        .modal-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: white;
            padding: 30px;
            border-radius: 8px;
            width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .modal input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        /* Анимации для Motion */
        .v-enter {
            opacity: 0;
            transform: scale(0.9);
        }

        .v-enter-active {
            transition: opacity 0.3s, transform 0.3s;
            opacity: 1;
            transform: scale(1);
        }

        .v-leave {
            opacity: 1;
            transform: scale(1);
        }

        .v-leave-active {
            transition: opacity 0.3s, transform 0.3s;
            opacity: 0;
            transform: scale(0.9);
        }
    </style>
</head>
<body>
<div id="app"></div>

<script src="../src/vnano.js"></script>
<script src="../src/vnano.components.js"></script>

<script>
    const {createApp, Motion} = $v;

    // 1. Бейдж
    class Badge extends Component {
        render() {
            return html`<span class="badge ${this.props.type || ''}">${this.props.text}</span>`;
        }
    }

    // 2. Строка пользователя (Интерактивная)
    class UserRow extends Component {
        render() {
            const {user, onRemove, onToggle} = this.props;
            return html`
                <div class="user-row">
                    <div>
                        <strong>${user.name}</strong>
                        ${user.isOnline ? html`
                            <${Badge} text="Online"/>` : html`
                            <${Badge} text="Offline" type="warn"/>`}
                    </div>
                    <div>
                        <button class="btn btn-sm" onclick=${() => onToggle(user.id)}>
                            Toggle Status
                        </button>
                        <button class="btn btn-sm btn-danger" onclick=${() => onRemove(user.id)}>
                            Remove
                        </button>
                    </div>
                </div>
            `;
        }
    }

    // 3. Карточка (Контейнер)
    class Card extends Component {
        render() {
            const {title, children, onRemove} = this.props;
            return html`
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <h3 style="margin: 0 0 10px 0;">${title}</h3>
                        ${onRemove ? html`
                            <button class="btn btn-sm btn-danger" onclick=${onRemove}>X</button>` : null}
                    </div>
                    <div>${children}</div>
                </div>
            `;
        }
    }

    // 4. Модальное окно (Использует Motion для анимации)
    class AddUserModal extends Component {
        constructor(props) {
            super(props);
            this.inputRef = null; // Храним ссылку на DOM элемент
        }

        handleAdd = () => {
            const val = this.inputRef ? this.inputRef.value : '';
            if (val) {
                this.props.onAdd(val);
                this.inputRef.value = ''; // Очищаем инпут вручную
            }
        };

        render() {
            const { show, onClose } = this.props;

            return html`
                <${Motion} show=${show} duration=${300}>
                    <div class="modal-bg" onclick=${onClose}>
                        <div class="modal" onclick=${(e) => e.stopPropagation()}>
                            <h2>Add New User</h2>
                            <input
                                    type="text"
                                    placeholder="Enter name..."
                                    ref=${(el) => this.inputRef = el}
                            />
                            <div style="text-align: right;">
                                <button class="btn btn-danger" onclick=${onClose}>Cancel</button>
                                <button class="btn btn-success" onclick=${this.handleAdd}>Add</button>
                            </div>
                        </div>
                    </div>
                </${Motion}>
            `;
        }
    }

    // 5. Корневой компонент (Управляет состоянием и списком)
    class RootView extends Component {
        constructor() {
            super();
            this.users = signal([
                {id: 1, name: 'Ivan Ivanov', isOnline: true},
                {id: 2, name: 'Petr Petrov', isOnline: false}
            ]);
            this.nextId = 3;
            this.isModalOpen = signal(false);
            this.showSystemStatus = signal(true);
        }

        addUser = (name) => {
            this.users.value = [...this.users.value, {id: this.nextId++, name, isOnline: true}];
            this.isModalOpen.value = false;
        };

        removeUser = (id) => {
            this.users.value = this.users.value.filter(u => u.id !== id);
        };

        toggleStatus = (id) => {
            this.users.value = this.users.value.map(u =>
                u.id === id ? {...u, isOnline: !u.isOnline} : u
            );
        };

        toggleStatusBlock = () => {
            this.showSystemStatus.value = !this.showSystemStatus.value;
        };

        render() {
            const users = this.users.value;
            const isModalOpen = this.isModalOpen.value;
            const showStatus = this.showSystemStatus.value;

            return html`
                <div class="sidebar">
                    <${Card} title="Navigation">
                        <p>Dashboard</p>
                        <p>Settings</p>
                        <p>Logout</p>
                    </${Card}>
                </div>

                <div class="main">
                    <div style="margin-bottom: 20px;">
                        <button class="btn btn-success" onclick=${() => this.isModalOpen.value = true}>+ Add User
                        </button>
                        <button class="btn" onclick=${this.toggleStatusBlock}>
                            ${showStatus ? 'Hide Status Block' : 'Show Status Block'}
                        </button>
                    </div>

                    <${Card} title="Team Members" onRemove=${() => console.log('Remove whole card')}>
                        ${users.length === 0 ? html`<p>No users found.</p>` :
                                users.map(user => html`
                                    <${UserRow}
                                            key=${user.id}
                                            user=${user}
                                            onRemove=${this.removeUser}
                                            onToggle=${this.toggleStatus}
                                    />
                                `)
                        }
                    </${Card}>

                    <!-- Условный рендеринг целого блока -->
                    ${showStatus ? html`
                        <${Card} title="System Status">
                            <p>Server
                                <${Badge} text="OK"/>
                            </p>
                            <p>Database
                                <${Badge} text="Slow" type="warn"/>
                            </p>
                            <p>Cache
                                <${Badge} text="Down" type="danger"/>
                            </p>
                        </${Card}>
                    ` : null}
                </div>

                <!-- Модальное окно (рендерится в конце, но фиксировано позиционируется) -->
                <${AddUserModal}
                        show=${isModalOpen}
                        onClose=${() => this.isModalOpen.value = false}
                        onAdd=${this.addUser}
                />
            `;
        }
    }

    createApp('#app').mount(RootView);
</script>
</body>
</html>
