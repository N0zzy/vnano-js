<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StylingEngine Visual Test</title>
</head>
<body>
<div id="app"></div>

<script src="../src/vnano.js"></script>
<script src="../src/vnano.components.js"></script>


<script>
    const {createApp, css, styled, keyframes, styles} = $v;

    // 1. Глобальные стили (сброс и фон страницы)
    styles`
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #333; padding: 40px; }
        * { box-sizing: border-box; }
    `;

    // 2. Keyframes анимация появления
    const fadeInUp = keyframes`
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        `;

    // 3. Стилизованный компонент: Карточка (с анимацией)
    const Card = styled('div')`
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 0 auto 20px auto;
            animation: ${fadeInUp} 0.6s ease-out;
        `;

    // 4. Стилизованный компонент: Кнопка (с вложенными хаверами)
    const Button = styled('button')`
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-right: 10px;
            transition: background 0.2s, transform 0.1s;

            &:hover {
                background: #0056b3;
            }

            &:active {
                transform: scale(0.95);
            }

            &.danger {
                background: #dc3545;
                &:hover { background: #c82333; }
            }
        `;

    // 5. Обычный изолированный класс (без создания компонента)
    const highlightText = css`
            color: #007bff;
            font-weight: bold;
        `;

    class RootView extends Component {
        render() {
            return h('div', null,
                h(Card, null,
                    h('h1', null, '⚡ CSS-in-JS Engine'),
                    h('p', null, 'Это полностью изолированные стили. Они не конфликтуют с глобальным CSS.'),
                    h('p', {class: highlightText}, 'Этот текст использует класс сгенерированный через css``'),
                    h('div', {style: 'margin-top: 20px;'},
                        h(Button, null, 'Primary'),
                        h(Button, {class: 'danger'}, 'Danger')
                    )
                )
            );
        }
    }

    createApp('#app').mount(RootView);
</script>
</body>
</html>
