<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTM Nested Components Visual Test</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #333;
            display: flex;
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .sidebar {
            width: 300px;
            flex-shrink: 0;
        }

        .main {
            flex: 1;
        }

        .badge {
            background: #007bff;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            margin-left: 10px;
        }

        .badge.warn {
            background: #ffc107;
            color: #333;
        }

        .badge.danger {
            background: #dc3545;
        }

        .avatar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .avatar img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ddd;
        }

        .user-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: #007bff;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div id="app"></div>

<script src="../src/vnano.js"></script>

<script>
    const {createApp} = $v;

    // 1. Базовый компонент: Бейдж
    class Badge extends Component {
        render() {
            const {text, type} = this.props;
            return html`<span class="badge ${type || ''}">${text}</span>`;
        }
    }

    // 2. Базовый компонент: Аватар
    class Avatar extends Component {
        render() {
            const {name, src} = this.props;
            return html`
                <div class="avatar">
                    <img src="${src}" alt="${name}"/>
                    <div>
                        <strong>${name}</strong>
                    </div>
                </div>
            `;
        }
    }

    // 3. Компонент-обертка: Карточка (Принимает детей!)
    class Card extends Component {
        render() {
            const {title, children} = this.props;
            return html`
                <div class="card">
                    ${title ? html`<h3 style="margin-top:0;">${title}</h3>` : null}
                    <div>${children}</div>
                </div>
            `;
        }
    }

    // 4. Составной компонент: Строка пользователя (Вкладывает Badge и Avatar)
    class UserRow extends Component {
        render() {
            const {user} = this.props;
            return html`
                <div class="user-row">
                    <${Avatar} name=${user.name} src=${user.avatar}/>
                    <div>
                        <span>${user.role}</span>
                        ${user.isOnline ? html`
                            <${Badge} text="Online"/>` : html`
                            <${Badge} text="Offline" type="warn"/>`}
                    </div>
                </div>
            `;
        }
    }

    // 5. Компонент: Список пользователей (Маппит UserRow)
    class UserList extends Component {
        render() {
            const {users} = this.props;
            return html`
                <div>
                    ${users.map(user => html`
                        <${UserRow} key=${user.id} user=${user}/>`)}
                </div>
            `;
        }
    }

    // 6. Корневой компонент: Сборка всего вместе
    class RootView extends Component {
        constructor() {
            super();
            this.users = [
                {id: 1, name: 'Ivan Ivanov', role: 'Admin', avatar: '', isOnline: true},
                {id: 2, name: 'Petr Petrov', role: 'Editor', avatar: '', isOnline: false},
                {id: 3, name: 'Anna Sidorova', role: 'Viewer', avatar: '', isOnline: true}
            ];
        }

        render() {
            return html`
                <div class="sidebar">
                    <${Card} title="Navigation">
                        <p>Dashboard</p>
                        <p>Settings</p>
                        <p>Logout</p>
                    </${Card}>
                </div>

                <div class="main">
                    <${Card} title="Team Members">
                        <p>Here is the list of your team. Use nested components.</p>
                        <${UserList} users=${this.users}/>
                    </${Card}>

                    <${Card}>
                        <h3>System Status</h3>
                        <p>Server
                            <${Badge} text="OK"/>
                        </p>
                        <p>Database
                            <${Badge} text="Slow" type="warn"/>
                        </p>
                        <p>Cache
                            <${Badge} text="Down" type="danger"/>
                        </p>
                    </${Card}>
                </div>
            `;
        }
    }

    createApp('#app').mount(RootView);
</script>
</body>
</html>
